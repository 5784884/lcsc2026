services:
  # MySQL 数据库服务
  lcsc-mysql:
    image: mysql:8.0
    container_name: lcsc-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: lcsc123456
      MYSQL_DATABASE: lcsc
      MYSQL_USER: lcsc_user
      MYSQL_PASSWORD: lcsc123456
    ports:
      - "13306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # 如果你有初始化 SQL，建议放在这里：- ./mysql-init:/docker-entrypoint-initdb.d
    networks:
      - lcsc-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      timeout: 20s
      retries: 10
      interval: 15s
      start_period: 60s

  # Redis 缓存服务
  lcsc-redis:
    image: redis:7-alpine
    container_name: lcsc-redis
    restart: unless-stopped
    command: redis-server --requirepass lcsc123456 --appendonly yes
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
      - ./redis-config/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - lcsc-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      timeout: 3s
      retries: 5
      interval: 10s
      start_period: 10s

  # 后端 Java 服务 (lcsc-crawler)
  lcsc-crawler:
    build:
      context: ./lcsc-crawler
      dockerfile: Dockerfile
    container_name: lcsc-crawler
    restart: unless-stopped
    ports:
      - "8080:8080"
    # 新增：环境变量配置，按需修改等号后面的数字即可
    environment:
      # 是否彻底关闭图片下载 (false=关闭, true=开启)
      - CRAWLER_ENABLE_IMAGE_DOWNLOAD=false
      # --- 主爬虫控制 ---
      # 爬虫主线程数 (控制同时处理的任务数)
      - CRAWLER_THREADS=5
      # 每次请求接口的基础间隔 (毫秒，越大越不容易被封IP)
      - CRAWLER_DELAY=2000
      # 遇到错误时的最大重试次数
      - CRAWLER_MAX_RETRY=10
      # 重试前等待的时间 (毫秒，报错后让爬虫休息一会儿再试)
      - CRAWLER_RETRY_INTERVAL=5000

      # --- 资源下载控制 ---
      # 图片下载的最大并发数 (控制同时下载多少张图片)
      - IMAGE_CONCURRENCY=5
      # 每张图片下载后的间隔时间 (毫秒)
      - IMAGE_DELAY=500
      # PDF下载的最大并发数 (说明书较大，强烈建议设为 1，防止带宽占满和被封)
      - PDF_CONCURRENCY=1
      # 每个PDF下载后的间隔时间 (毫秒)
      - PDF_DELAY=1500
      # 新增结束


    volumes:
      - ./lcsc-crawler/data/images:/app/images
      - ./lcsc-crawler/data/pdfs:/app/pdfs
      - ./lcsc-crawler/data/exports:/app/exports
      - ./lcsc-crawler/data/results:/app/data/results
      - ./lcsc-crawler/logs:/app/logs

    depends_on:
      lcsc-mysql:
        condition: service_healthy
      lcsc-redis:
        condition: service_healthy
    networks:
      - lcsc-network

  # 前端 Nginx 服务 (lcsc-frontend)
  lcsc-frontend:
    image: nginx:alpine
    container_name: lcsc-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./lcsc-frontend/dist:/usr/share/nginx/html:ro
      - ./lcsc-frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - lcsc-crawler
    networks:
      - lcsc-network

  # 可选：phpMyAdmin 管理工具
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: lcsc-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: lcsc-mysql
      PMA_PORT: 3306
      PMA_USER: lcsc_user
      PMA_PASSWORD: lcsc123456
      MYSQL_ROOT_PASSWORD: lcsc123456
    ports:
      - "8081:80"
    depends_on:
      lcsc-mysql:
        condition: service_healthy
    networks:
      - lcsc-network

  # 可选：Redis Commander 管理工具
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: lcsc-redis-commander
    restart: unless-stopped
    environment:
      REDIS_HOSTS: "local:lcsc-redis:6379:0:lcsc123456"
      HTTP_USER: admin
      HTTP_PASSWORD: lcsc123456
    ports:
      - "8082:8081"
    depends_on:
      lcsc-redis:
        condition: service_healthy
    networks:
      - lcsc-network

# 数据持久化卷
volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

# 网络配置
networks:
  lcsc-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16